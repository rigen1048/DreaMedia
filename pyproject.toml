[project]
name = "dreamedia"
version = "0.1.0"
description = "DreaMedia backend — self-hosted, privacy-first media tracker (HydraWatch redesign)"
requires-python = ">=3.12"
dependencies = [
    "httpx[brotli,http2]>=0.28",
    "returns>=0.26",
    "yt-dlp>=2025.10.22",
    "pydantic>=2.12",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
