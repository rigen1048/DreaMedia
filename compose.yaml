# DreaMedia docker app (D6: home-server docker app, not a production server).
# Postgres only holds ciphertext — per-user keys derive from passwords at
# login and live only in the app's in-memory vault (D8/D9).
# ACCESS (D54): 'wifi' publishes on 0.0.0.0 (LAN), 'computer' on 127.0.0.1 only.
#
# Flow: db (Postgres 17) → backend (FastAPI + GraphQL + notifications) →
# frontend (nginx + SPA, proxies application APIs directly to the backend).
services:
  db:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamedia
      POSTGRES_PASSWORD: ${DREAMEDIA_PG_PASSWORD:?Set DREAMEDIA_PG_PASSWORD in the root .env}
      POSTGRES_DB: dreamedia
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:${DREAMEDIA_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamedia -d dreamedia"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    build: ./Backend
    restart: unless-stopped
    # Match the host user: dumps written into ./backups must stay owned by
    # whoever runs start.py, otherwise pruning/restoring hits permissions.
    user: "${DREAMEDIA_UID:-1000}:${DREAMEDIA_GID:-1000}"
    environment:
      DREAMEDIA_PG_HOST: db
      DREAMEDIA_PG_PORT: "5432"
      DREAMEDIA_PG_PASSWORD: ${DREAMEDIA_PG_PASSWORD:?Set DREAMEDIA_PG_PASSWORD in the root .env}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:8123:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8123/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:8124:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
