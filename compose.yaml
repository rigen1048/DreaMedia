# DreaMedia docker app (D6: home-server docker app, not a production server).
# Postgres only holds ciphertext — per-user keys derive from passwords at
# login and live only in the app's in-memory vault (D8/D9).
# ACCESS (D54): 'wifi' publishes on 0.0.0.0 (LAN), 'computer' on 127.0.0.1 only.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreamedia
      POSTGRES_PASSWORD: ${DREAMEDIA_PG_PASSWORD:?Set DREAMEDIA_PG_PASSWORD in the root .env}
      POSTGRES_DB: dreamedia
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamedia"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      DREAMEDIA_PG_DSN: postgresql://dreamedia:${DREAMEDIA_PG_PASSWORD}@db:5432/dreamedia
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./Frontend
    restart: unless-stopped
    ports:
      - "${ACCESS_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
