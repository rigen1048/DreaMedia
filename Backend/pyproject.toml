[project]
name = "dreamedia"
version = "0.1.0"
description = "DreaMedia backend — self-hosted, privacy-first media tracker (HydraWatch redesign)"
requires-python = ">=3.12"
# Exact pins on purpose (rebuild-anytime rule): a `docker compose build`
# years from now must resolve the same tree. uv.lock is the authority;
# keep these versions equal to the locked ones when bumping.
dependencies = [
    "httpx[brotli,http2]==0.28.1",
    "returns==0.30.0",
    "yt-dlp==2026.10.26",
    "pydantic==2.14.2",
    "zstandard==0.25.0",
    "asyncpg==0.32.0",
    "argon2-cffi==25.1.0",
    "pynacl==1.6.2",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "strawberry-graphql==0.339.0",
    "polars==2.1.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
