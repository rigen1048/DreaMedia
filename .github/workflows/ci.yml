name: ci
on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Bun is the ONLY supported package manager for the frontend
      # (the Dockerfile builds with it; package-lock.json was removed).
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Compile check only: the test suite needs live Postgres, YouTube and
      # AniList — those run locally, not in CI.
      - run: uv run python -m compileall -q App Auth Admin Config Database Gate Graphql Media Model Utility

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install extension dependencies
        run: npm install
        working-directory: Extension
      - name: build MV2 and MV3 from shared source
        run: python3 setup.py --build-extensions-only
      - name: run extension tests
        run: node --test Extension/tests/*.test.cjs
      - name: syntax-check generated packages
        run: find Extension/dist -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: validate generated package contents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("Extension")
          for variant, version in (("mv2", 2), ("mv3", 3)):
              output = root / "dist" / variant
              manifest = json.loads((output / "manifest.json").read_text())
              assert manifest.get("manifest_version") == version, variant
              assert manifest.get("icons"), f"{variant} missing icons"
              if version == 2:
                  assert manifest["background"]["scripts"] == ["background.js"]
                  assert manifest["browser_action"]["default_popup"] == "popup.html"
                  assert "default_icon" in manifest["browser_action"], f"{variant} missing default_icon"
              else:
                  assert manifest["background"]["service_worker"] == "background.js"
                  assert manifest["action"]["default_popup"] == "popup.html"
                  assert "default_icon" in manifest["action"], f"{variant} missing default_icon"
              required = {"background.js", "popup.js", "imports.js", "core.js", "manifest.json"}
              actual = {path.name for path in output.iterdir() if path.is_file()}
              assert required.issubset(actual), (variant, sorted(required - actual))
          print("Both generated packages contain the required files and correct manifests.")
          PY
