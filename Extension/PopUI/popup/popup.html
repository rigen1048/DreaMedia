<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DreaMedia</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="gear" viewBox="0 0 24 24"><path d="m9.4 4 .5-1.3h4.2l.5 1.3a2 2 0 0 0 1.8 1.2l1.4-.2 2.1 3.6-.9 1.1a2 2 0 0 0 0 2.1l.9 1.1-2.1 3.6-1.4-.2a2 2 0 0 0-1.8 1.2l-.5 1.3H9.9l-.5-1.3a2 2 0 0 0-1.8-1.2l-1.4.2-2.1-3.6.9-1.1a2 2 0 0 0 0-2.1l-.9-1.1 2.1-3.6 1.4.2A2 2 0 0 0 9.4 4Z" transform="translate(0 1.2)"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="video" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="4"/><path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="3.75" ry="8.5"/><path d="M3.5 12h17"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12a2.2 2.2 0 0 0 4 0"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M3.5 6h14m-14 6h14m-14 6h8m6-3 4 3-4 3z"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="m11 5-7 7 7 7m-7-7h16"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="m10 13 4-4m-5.5 6.5-1 1a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0m1-1 1-1a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0" transform="translate(1.5 1)"/></symbol>
  </svg>

  <header class="popup-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">d<span>/</span>m</span>
      <span class="brand-name">DreaMedia</span>
    </div>
    <button id="closeSettings" class="icon-button" type="button" aria-label="Back to page actions" title="Back to page actions" hidden>
      <svg aria-hidden="true"><use href="#back"/></svg>
    </button>
    <button id="openSettings" class="icon-button" type="button" aria-label="Connection settings" title="Connection settings">
      <svg><use href="#gear"/></svg>
    </button>
  </header>

  <main id="actions" class="popup-content">
    <section id="site" class="site" aria-label="Current site">
      <div class="site-card">
        <span id="siteIcon" class="site-icon"><svg><use href="#globe"/></svg></span>
        <div class="site-info">
          <p class="eyebrow">Current site</p>
          <p id="siteHost" class="site-host" tabindex="-1">Checking site…</p>
        </div>
        <span id="siteBadge" class="site-badge" hidden></span>
      </div>
      <div id="siteEnable" class="site-enable" hidden>
        <label class="sr-only" for="siteMedia">Site type</label>
        <div id="siteMediaWrap" class="select-wrap">
          <select id="siteMedia">
            <option value="ani">Anime</option>
            <option value="yt">YouTube</option>
          </select>
          <svg><use href="#chevron"/></svg>
        </div>
        <button id="enableSite" class="secondary" type="button">Enable site</button>
      </div>
      <p id="siteStatus" class="status" role="status"></p>
    </section>

    <section id="trackingCard" class="tracking-card" data-state="idle" aria-live="polite" aria-label="Anime tracking status" hidden>
      <span id="trackingDot" class="tracking-dot" aria-hidden="true"></span>
      <div class="tracking-copy">
        <strong id="trackingTitle">Not tracking anime</strong>
        <span id="trackingDetail">Open an enabled anime tab</span>
      </div>
      <span id="trackingTime" class="tracking-time">—:—</span>
    </section>

    <div id="pageActions" class="tabs" role="tablist" aria-label="Page actions">
      <button id="subscribeTab" type="button" role="tab" aria-selected="true" aria-controls="subscribePanel"><svg aria-hidden="true"><use href="#bell"/></svg>Source</button>
      <button id="playlistTab" type="button" role="tab" aria-selected="false" aria-controls="playlistPanel" tabindex="-1"><svg aria-hidden="true"><use href="#list"/></svg>Save video</button>
    </div>

    <section id="subscribePanel" class="panel" role="tabpanel" aria-labelledby="subscribeTab">
      <h1>Add YouTube source</h1>
      <div class="fields">
        <div class="field">
          <label for="kind">Notification type</label>
          <div class="select-wrap">
            <select id="kind">
              <option value="tracking">Track — every upload</option>
              <option value="wordscan">WordScan — matching titles</option>
              <option value="random">Random — occasional picks</option>
              <option value="withhold">Withhold — release in batches</option>
              <option value="playlist">Playlist — new playlist items</option>
            </select>
            <svg><use href="#chevron"/></svg>
          </div>
        </div>
        <div id="rankField" class="field" hidden>
          <label for="rank">Frequency</label>
          <div class="select-wrap">
            <select id="rank">
              <option value="day">Daily</option>
              <option value="tri_day">Every 3 days</option>
              <option value="week" selected>Weekly</option>
              <option value="bi_week">Every 2 weeks</option>
              <option value="month">Monthly</option>
            </select>
            <svg><use href="#chevron"/></svg>
          </div>
        </div>
        <div id="withholdField" class="field" hidden>
          <label for="withhold">Batch size</label>
          <input id="withhold" type="number" min="1" step="1" value="2">
        </div>
        <div id="wordsField" class="field" hidden>
          <label for="words">Words to match</label>
          <input id="words" placeholder="trailer, live, devlog">
        </div>
        <div class="pair">
          <div class="field">
            <label for="domain">Domain (optional)</label>
            <input id="domain" list="domainSuggestions" placeholder="Technology" autocomplete="off">
            <datalist id="domainSuggestions"></datalist>
          </div>
          <div class="field">
            <label for="subdomain">Subdomain (optional)</label>
            <input id="subdomain" list="subdomainSuggestions" placeholder="Choose a domain first" autocomplete="off" disabled>
            <datalist id="subdomainSuggestions"></datalist>
          </div>
        </div>
      </div>
      <div class="source-actions">
        <button id="scanSubscriptions" class="secondary" type="button">Scan subscriptions</button>
        <button id="subscribe" class="primary" type="button"><svg aria-hidden="true"><use href="#plus"/></svg><span id="subscribeLabel">Add source</span></button>
      </div>
      <ul id="importPreview" class="import-preview" hidden></ul>
      <p id="importStatus" class="status" role="status"></p>
      <button id="openImportTable" class="import-table-button" type="button" hidden>
        <svg aria-hidden="true"><use href="#list"/></svg>
        <span>View import table</span>
        <span id="importTableMeta" class="import-table-meta"></span>
      </button>
      <p id="subStatus" class="status" role="status"></p>
    </section>

    <section id="playlistPanel" class="panel" role="tabpanel" aria-labelledby="playlistTab" hidden>
      <h1>Add to a playlist</h1>
      <div class="fields">
        <div class="field">
          <label for="card">Custom playlist</label>
          <div class="select-wrap"><select id="card"><option value="">Loading playlists…</option></select><svg><use href="#chevron"/></svg></div>
        </div>
      </div>
      <div class="panel-actions">
        <p id="cardStatus" class="status" role="status"></p>
        <button id="addVideo" class="primary" type="button"><svg aria-hidden="true"><use href="#plus"/></svg>Add video</button>
      </div>
    </section>

  </main>

  <main id="setup" class="popup-content setup" hidden>
    <section class="panel">
      <h1 id="setupTitle" tabindex="-1">Connection settings</h1>
      <div class="fields">
        <div class="field">
          <label for="backendUrl">Backend URL</label>
          <input id="backendUrl" value="http://127.0.0.1:8123" inputmode="url" spellcheck="false" autocomplete="off">
        </div>
        <div class="field">
          <label for="token">Extension token</label>
          <input id="token" type="password" placeholder="dm_…" spellcheck="false" autocomplete="off">
        </div>
      </div>
      <div class="panel-actions">
        <p id="configStatus" class="status" role="status"></p>
        <button id="saveConfig" class="primary" type="button"><svg aria-hidden="true"><use href="#link"/></svg>Save &amp; connect</button>
      </div>
    </section>
  </main>

  <footer class="popup-footer">
    <span id="connection" class="connection" data-state="loading" role="status"><span class="connection-dot"></span><span id="connectionText">Checking connection…</span></span>
    <span class="version">v<span id="version">1.0.0</span></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
