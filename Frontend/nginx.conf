# Static SPA + same-origin API proxy (mirrors the Vite dev proxy prefixes).
# Single worker by design (owner decision 2026-11-19): one backend
# container, one uvicorn worker. Sessions are DB-backed so a restart
# doesn't log anyone out; the manager is leader-elected so an accidental
# second backend instance stays idle instead of double-polling.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin restore uploads a full pg dump — the 1 MB default would reject it.
    client_max_body_size 0;
    client_body_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /auth/          { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /graphql        { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /notifications  { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /admin/         { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /yt/            { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /ani/           { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /health         { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }

    # Frontend-owned notification receiver. The browser may only read and
    # acknowledge; the backend pushes to the bridge container directly, so a
    # forged POST from the LAN cannot ring the bell.
    location = /bridge/api/notifications {
        limit_except GET { deny all; }
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://bridge:3100/api/notifications$is_args$args;
    }
    location = /bridge/api/notifications/seen {
        include /etc/nginx/proxy_common.conf;
        proxy_pass http://bridge:3100/api/notifications/seen;
    }
    # SSE needs buffering off and a long read timeout, otherwise the bell
    # goes quiet after 60 s.
    location /bridge/ {
        proxy_pass http://bridge:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
