# Static frontend + API proxy (same prefixes the vite dev proxy uses).
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/         { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /graphql       { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /notifications { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /admin/        { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /yt/           { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /ani/          { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /health        { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    location / { try_files $uri $uri/ /index.html; }
}
