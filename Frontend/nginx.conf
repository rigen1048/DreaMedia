# Static SPA + same-origin API proxy (mirrors the Vite dev proxy prefixes).
# Preserve ordinary POST behavior while enabling Upgrade for WebSocket requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Single worker by design (owner decision 2026-11-19): one backend
# container, one uvicorn worker. Sessions are DB-backed so a restart
# doesn't log anyone out; the manager is leader-elected so an accidental
# second backend instance stays idle instead of double-polling.
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin restore uploads a full pg dump — the 1 MB default would reject it.
    client_max_body_size 0;
    client_body_timeout 300s;
    send_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /auth/          { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /graphql        { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location = /ext/graphql {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    location /notifications  { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /admin/         { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /yt/            { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /ani/           { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }
    location /health         { proxy_pass http://backend:8000; include /etc/nginx/proxy_common.conf; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
